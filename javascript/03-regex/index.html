<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8" /><title>Validação com Regex</title></head>
<body>
  <form id="formulario">
    <label for="nome_usuario">Nome de usuário:</label>
    <input type="text" id="nome_usuario" name="nome_usuario" placeholder="Digite seu nome de usuário">
    <button type="submit">Validar</button>
    <div id="mensagem"></div>
  </form>
  <p>Regras: começa com letra, tem de 5 a 15 caracteres, só letras, números, _ e -.</p>

  <script>
    const formulario = document.getElementById("formulario");
    const nome_usuarioEntrada = document.getElementById("nome_usuario");
    const mensagem = document.getElementById("mensagem");

    formulario.addEventListener("submit", function (event) {
      event.preventDefault(); 
      const nome_usuario = nome_usuarioEntrada.value;
      let regra = /^[a-zA-Z][a-zA-Z0-9_-]{4,14}$/;

      if (nome_usuario) {
        if (regra.test(nome_usuario)) {
          mensagem.textContent = "Nome de usuário válido!";
          mensagem.style.color = "green";
        } else {
          mensagem.textContent = "Nome de usuário inválido. Por favor, siga as regras.";
          mensagem.style.color = "red";
        }
      } else {
        mensagem.textContent = "Por favor, insira um nome de usuário.";
        mensagem.style.color = "red";
      }
    });
  </script>
</body>
</html>
