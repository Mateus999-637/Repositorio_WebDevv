<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8" /><title>Notas dos Alunos</title></head>
<body>
  <h1>Notas dos Alunos</h1>
  <form>
    <label for="nome">Nome do aluno:</label>
    <input type="text" id="nome" name="nome"><br>
    <label for="nota">Nota do aluno:</label>
    <input type="number" id="nota" name="nota" min="0" max="10"><br>
    <button type="button" onclick="adicionarAluno()">Adicionar aluno</button>
  </form>

  <table border="1">
    <thead><tr><th>Aluno</th><th>Nota</th></tr></thead>
    <tbody id="tabela-notas"></tbody>
  </table>
  <p id="media"></p>

  <script>
    const alunos = [];

    function adicionarAluno() {
      const nome = document.getElementById("nome").value;
      const nota = document.getElementById("nota").valueAsNumber;
    
      if (nome && !isNaN(nota)) {
        alunos.push({ nome, nota });
        atualizarTabela();
      }
    }

    function atualizarTabela() {
      const tabelaNotas = document.getElementById("tabela-notas");
      tabelaNotas.innerHTML = "";
      let somaNotas = 0;
      for (let i = 0; i < alunos.length; i++) {
        const tr = document.createElement("tr");
        const tdNome = document.createElement("td");
        const tdNota = document.createElement("td");
        tdNome.innerText = alunos[i].nome;
        tdNota.innerText = alunos[i].nota;
        tr.appendChild(tdNome);
        tr.appendChild(tdNota);
        tabelaNotas.appendChild(tr);
        somaNotas += alunos[i].nota;
      }
      const media = somaNotas / alunos.length;
      document.getElementById("media").textContent = "A média das notas é: " + media.toFixed(2);
    }
  </script>
</body>
</html>
