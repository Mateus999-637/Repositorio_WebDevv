<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b3b72">
    <title>Form</title>
    <!-- <link rel="stylesheet" href="../../css/estilizacao-form/form.css"> -->
</head>
<body>
    <main class="page-shell">
      <section class="login-card" aria-labelledby="form-title">
        <p class="eyebrow">ACESSO À CONTA</p>
        <h1 id="form-title">Boas-vindas</h1>
        <p class="intro">Entre com seus dados para continuar.</p>
        <form action="/submit-login" method="POST">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
            </div>
            
            <button type="submit">Entrar</button>
        </form>
        <p class="security-note">Seus dados são usados apenas para acessar sua conta.</p>
        <div class="forgot">
            <p>Esqueceu sua senha? <a href="#">Clique aqui</a> pra recuperar</p>
        </div>
      </section>
    </main>
</body>
</html>
